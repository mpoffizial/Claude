# ═══════════════════════════════════════════════════════════════════════════
#  GTA-6-Clipmaschine
#  Clippt die Highlights ALLER Twitch-Streams von Grand Theft Auto VI und postet sie
#  auf TikTok, Instagram Reels und YouTube Shorts.
#  Braucht TWITCH_CLIENT_ID/SECRET in der .env (kostenlose App: dev.twitch.tv/console/apps).
#  Alle weiteren Optionen: clipmaschine/config.example.yaml
# ═══════════════════════════════════════════════════════════════════════════

# Dauerbetrieb: postet so viel, wie die Plattformen zuverlässig mitmachen.
# Erst nur EINEN Probeclip ansehen (nichts posten, danach stoppen): test_mode: true
test_mode: false

streamers: []                         # optional: Kanäle mit eigenem Facecam-Layout

data_dir: clipmaschine_data

discovery:
  games: ["Grand Theft Auto VI"]      # die Maschine wartet, bis es Kategorie und Clips gibt
  games_start_at: "2026-11-18"        # ab hier wird geclippt (erste Streams laufen schon vor dem Release)
  interval_minutes: 10                # alle 10 Minuten nach neuen Highlights suchen
  lookback_hours: 12
  min_views: 150                      # nur Clips, die schon gut laufen
  min_duration: 8
  max_duration: 60
  gravity: 1.5                        # frische, schnell wachsende Clips zuerst
  max_new_per_game: 12
  max_per_broadcaster_per_day: 2      # Abwechslung statt 10 Clips vom selben Streamer
  languages: []                       # leer = alle; nur deutsche Streams: [de]
  exclude_broadcasters: []            # Streamer, die keine Reposts möchten
  exclude_keywords: [leak, spoiler]

editing:
  layout: blur
  max_duration: 59
  hook_text: true
  hook_uppercase: true
  credit_text: true                   # twitch.tv/<streamer> im Video
  # Virales Format "Hook-First":
  cold_open: true                     # 1,2 s Teaser vom Höhepunkt + "WARTE BIS ZUM ENDE" + Blitz-Schnitt
  cold_open_text: "WARTE BIS ZUM ENDE"
  smart_trim: true                    # auf den lautesten Moment kürzen ...
  trim_before_peak: 10
  trim_after_peak: 4                  # ... und kurz danach enden (Loop, hohe Abschlussrate)
  trim_max_seconds: 25
  punch_zoom: true                    # Zoom-Schnitt beim Höhepunkt
  progress_bar: true
  progress_bar_color: "#2DE2E6"       # Vice-City-Türkis
  # Animierter Kanal-Banner über dem Video (einmal mit Higgsfield erstellt, wird lokal eingeblendet).
  # Eigener Banner: Pfad zu .mp4/.png eintragen; ausschalten: banner: ""
  banner: presets/branding/gta6_banner_loop.mp4
  caption_highlight_color: "#FF3EA5"  # Vice-City-Pink
  hook_color: "#FFFFFF"

captions:
  enabled: true                       # die meisten schauen ohne Ton – Untertitel halten sie im Video
  model: small                        # wird beim Start automatisch installiert (ohne: Videos ohne Untertitel)

metadata:
  use_claude: auto
  language: de
  title_prefix: "GTA 6: "
  extra_instructions: >-
    Die Clips stammen aus GTA 6 (Grand Theft Auto VI), kurz nach dem Release. Der Hook soll neugierig auf
    den Höhepunkt machen, ihn aber nicht verraten. Keine Spoiler zur Story.
  default_hashtags: [gta6, gtavi, grandtheftauto6, rockstargames, gta6clips, gaming, fyp]
  max_hashtags: 8

tiktok:
  enabled: true
  max_posts_per_day: 10
  method: browser
  check_recommendation: true          # nach dem Posten prüfen, ob das Video weiterempfohlen wird
  check_after_minutes: 20
  restricted_pause_threshold: 2       # 2 nicht empfohlene Videos in 24 h → 24 h Schutzpause

instagram:
  enabled: true
  max_posts_per_day: 10
  method: browser

youtube:
  enabled: true                       # wird übersprungen, bis YouTube verbunden ist ("Konten verbinden")
  max_posts_per_day: 10               # meldet YouTube das Upload-Limit, pausiert nur YouTube 12 h
  method: browser                     # mit deinem Google-Konto über YouTube Studio – Videos sofort öffentlich
  privacy_status: public
  category_id: "20"

# Maximal-Profil: 10 Posts pro Tag auf TikTok, Instagram und YouTube (30 Videos am Tag),
# mindestens 60 Minuten Abstand, 8–24 Uhr. Mehr lassen neue Accounts kaum zu, ohne dass die Videos
# als Spam gelten. Stuft TikTok trotzdem mehrere Videos herab, greift automatisch die Schutzpause.
# Ruhiger: python -m clipmaschine set --profil normal
posting:
  max_posts_per_day: 10
  min_minutes_between_posts: 60
  active_hours: [8, 24]
  timezone: Europe/Berlin
  max_clip_age_hours: 36
  queue_size: 10
